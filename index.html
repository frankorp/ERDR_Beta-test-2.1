    <script>
        // 🗄️ INDEXEDDB DATABASE
        class CaseDatabase {
            constructor() {
                this.dbName = 'ERDR_PRO_DB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        // Create cases store
                        if (!db.objectStoreNames.contains('cases')) {
                            const casesStore = db.createObjectStore('cases', { keyPath: 'id', autoIncrement: true });
                            casesStore.createIndex('status', 'status', { unique: false });
                            casesStore.createIndex('priority', 'priority', { unique: false });
                            casesStore.createIndex('type', 'type', { unique: false });
                            casesStore.createIndex('investigator', 'investigator', { unique: false });
                        }
                        
                        // Create audit log store
                        if (!db.objectStoreNames.contains('audit')) {
                            const auditStore = db.createObjectStore('audit', { keyPath: 'id', autoIncrement: true });
                            auditStore.createIndex('timestamp', 'timestamp', { unique: false });
                            auditStore.createIndex('user', 'user', { unique: false });
                        }
                    };
                });
            }

            async addCase(caseData) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['cases'], 'readwrite');
                    const store = transaction.objectStore('cases');
                    const request = store.add({
                        ...caseData,
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async getAllCases() {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['cases'], 'readonly');
                    const store = transaction.objectStore('cases');
                    const request = store.getAll();
                    
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async searchCases(query, filters = {}) {
                const allCases = await this.getAllCases();
                
                return allCases.filter(caseItem => {
                    // Text search
                    const matchesSearch = !query || 
                        caseItem.title.toLowerCase().includes(query.toLowerCase()) ||
                        caseItem.description.toLowerCase().includes(query.toLowerCase()) ||
                        caseItem.id.toString().includes(query);
                    
                    // Filter by status
                    const matchesStatus = !filters.status || filters.status === 'all' || 
                        caseItem.status === filters.status;
                    
                    // Filter by priority
                    const matchesPriority = !filters.priority || filters.priority === 'all' || 
                        caseItem.priority === filters.priority;
                    
                    // Filter by type
                    const matchesType = !filters.type || filters.type === 'all' || 
                        caseItem.type === filters.type;
                    
                    return matchesSearch && matchesStatus && matchesPriority && matchesType;
                });
            }

            async logAudit(action, details) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['audit'], 'readwrite');
                    const store = transaction.objectStore('audit');
                    const request = store.add({
                        action,
                        details,
                        user: 'Денисенко Є.В.',
                        timestamp: new Date()
                    });
                    
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
        }

        // 🛡️ SECURITY MANAGER
        class SecurityManager {
            constructor() {
                this.accessLevels = {
                    'top_secret': ['view_all', 'edit_all', 'delete', 'export', 'audit'],
                    'secret': ['view_assigned', 'edit_assigned', 'create'],
                    'confidential': ['view_limited', 'comment'],
                    'public': ['view_public']
                };
                
                this.currentUser = {
                    name: 'Денисенко Є.В.',
                    role: 'Старший слідчий',
                    level: 'top_secret'
                };
            }

            hasPermission(permission) {
                return this.accessLevels[this.currentUser.level].includes(permission);
            }

            encryptData(data) {
                // Basic encryption for demo purposes
                return btoa(JSON.stringify(data));
            }

            decryptData(encryptedData) {
                try {
                    return JSON.parse(atob(encryptedData));
                } catch (e) {
                    console.error('Decryption failed:', e);
                    return null;
                }
            }
        }

        // 🚀 PWA FUNCTIONALITY
        class PWAInstaller {
            constructor() {
                this.deferredPrompt = null;
                this.init();
            }

            init() {
                // Register Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js')
                        .then(registration => console.log('SW registered'))
                        .catch(error => console.log('SW registration failed'));
                }

                // Listen for install prompt
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    this.showInstallPrompt();
                });

                // Track app installed
                window.addEventListener('appinstalled', () => {
                    this.hideInstallPrompt();
                    console.log('PWA installed');
                });
            }

            showInstallPrompt() {
                const prompt = document.getElementById('installPrompt');
                prompt.style.display = 'flex';
            }

            hideInstallPrompt() {
                const prompt = document.getElementById('installPrompt');
                prompt.style.display = 'none';
            }

            async installPWA() {
                if (this.deferredPrompt) {
                    this.deferredPrompt.prompt();
                    const { outcome } = await this.deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        this.hideInstallPrompt();
                    }
                    this.deferredPrompt = null;
                }
            }
        }

        // 📱 MOBILE FUNCTIONALITY
        class MobileUI {
            constructor() {
                this.currentView = 'cases';
                this.init();
            }

            init() {
                this.setupMobileNav();
                this.detectMobile();
                this.setupTouchGestures();
            }

            setupMobileNav() {
                const navBtns = document.querySelectorAll('.nav-btn');
                navBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        navBtns.forEach(b => b.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        this.switchView(e.currentTarget.textContent);
                    });
                });
            }

            switchView(view) {
                // Handle mobile view switching
                console.log('Switching to view:', view);
                // Implementation for mobile views
            }

            detectMobile() {
                if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                    document.body.classList.add('mobile-device');
                }
            }

            setupTouchGestures() {
                let startX, startY;
                
                document.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });

                document.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;

                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;
                    
                    const diffX = startX - endX;
                    const diffY = startY - endY;

                    // Swipe left/right detection
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                        if (diffX > 0) {
                            this.handleSwipe('left');
                        } else {
                            this.handleSwipe('right');
                        }
                    }
                });
            }

            handleSwipe(direction) {
                console.log('Swipe detected:', direction);
                // Implement swipe navigation
            }
        }

        // 💾 OFFLINE FUNCTIONALITY
        class OfflineManager {
            constructor() {
                this.isOnline = navigator.onLine;
                this.init();
            }

            init() {
                window.addEventListener('online', () => this.handleOnline());
                window.addEventListener('offline', () => this.handleOffline());
                
                // Check initial status
                if (!this.isOnline) {
                    this.handleOffline();
                }
            }

            handleOnline() {
                this.isOnline = true;
                document.body.classList.remove('offline');
                console.log('App is online');
                // Sync pending changes
                this.syncPendingChanges();
            }

            handleOffline() {
                this.isOnline = false;
                document.body.classList.add('offline');
                console.log('App is offline');
                this.showOfflineNotification();
            }

            showOfflineNotification() {
                // Show offline indicator
                const indicator = document.createElement('div');
                indicator.style.cssText = `
                    position: fixed;
                    top: 10px;
                    right: 10px;
                    background: var(--warning);
                    color: white;
                    padding: 10px 15px;
                    border-radius: 10px;
                    z-index: 1002;
                `;
                indicator.textContent = '🔴 Офлайн режим';
                indicator.id = 'offlineIndicator';
                document.body.appendChild(indicator);
            }

            async syncPendingChanges() {
                // Sync any pending changes when coming online
                console.log('Syncing pending changes...');
            }
        }

        // 🎯 MAIN APPLICATION
        class ERDRApp {
            constructor() {
                this.db = new CaseDatabase();
                this.security = new SecurityManager();
                this.cases = [];
                this.init();
            }

            async init() {
                await this.db.init();
                await this.loadCases();
                this.setupEventListeners();
                this.updateStatistics();
                
                // Log initial access
                await this.db.logAudit('system_access', 'User accessed the system');
            }

            async loadCases() {
                this.cases = await this.db.getAllCases();
                
                // If no cases, add sample data
                if (this.cases.length === 0) {
                    await this.addSampleData();
                    this.cases = await this.db.getAllCases();
                }
                
                this.renderCases();
            }

            async addSampleData() {
                const sampleCases = [
                    {
                        title: "Розслідування корупційної схеми",
                        description: "Розслідування щодо незаконного збагачення посадових осіб",
                        type: "criminal",
                        priority: "critical",
                        status: "active",
                        investigator: "Денисенко Є.В.",
                        createdDate: "2023-10-15"
                    },
                    {
                        title: "Перевірка фінансових операцій",
                        description: "Аналіз підозрілих банківських транзакцій",
                        type: "administrative",
                        priority: "high",
                        status: "active",
                        investigator: "Денисенко Є.В.",
                        createdDate: "2023-11-20"
                    },
                    {
                        title: "Внутрішня перевірка персоналу",
                        description: "Перевірка співробітників на предмет конфлікту інтересів",
                        type: "internal",
                        priority: "medium",
                        status: "pending",
                        investigator: "Денисенко Є.В.",
                        createdDate: "2023-12-05"
                    }
                ];

                for (const caseData of sampleCases) {
                    await this.db.addCase(caseData);
                }
            }

            renderCases(casesToRender = null) {
                const casesList = document.getElementById('casesList');
                const cases = casesToRender || this.cases;
                
                casesList.innerHTML = '';
                
                if (cases.length === 0) {
                    casesList.innerHTML = '<div style="text-align: center; padding: 40px; color: #94a3b8;">Справ не знайдено</div>';
                    return;
                }
                
                cases.forEach((caseItem, index) => {
                    const caseElement = document.createElement('div');
                    caseElement.className = 'case-item';
                    caseElement.onclick = () => this.showCaseDetails(caseItem);
                    
                    const priorityClass = `priority-${caseItem.priority}`;
                    
                    caseElement.innerHTML = `
                        <div class="case-header">
                            <div class="case-id">Справа #${caseItem.id}</div>
                            <div class="case-priority ${priorityClass}">${this.getPriorityText(caseItem.priority)}</div>
                        </div>
                        <h3>${caseItem.title}</h3>
                        <p>${caseItem.description}</p>
                        <div class="case-details">
                            <div><strong>Тип:</strong> ${this.getTypeText(caseItem.type)}</div>
                            <div><strong>Статус:</strong> ${this.getStatusText(caseItem.status)}</div>
                            <div><strong>Слідчий:</strong> ${caseItem.investigator}</div>
                            <div><strong>Створено:</strong> ${caseItem.createdDate}</div>
                        </div>
                    `;
                    
                    casesList.appendChild(caseElement);
                });
            }

            getPriorityText(priority) {
                const priorities = {
                    'critical': 'Критичний',
                    'high': 'Високий',
                    'medium': 'Середній',
                    'low': 'Низький'
                };
                return priorities[priority] || priority;
            }

            getTypeText(type) {
                const types = {
                    'criminal': 'Кримінальна',
                    'administrative': 'Адміністративна',
                    'internal': 'Внутрішня'
                };
                return types[type] || type;
            }

            getStatusText(status) {
                const statuses = {
                    'active': 'Активна',
                    'pending': 'На розгляді',
                    'closed': 'Закрита'
                };
                return statuses[status] || status;
            }

            async showCaseDetails(caseItem) {
                const modal = document.getElementById('caseDetailsModal');
                const content = document.getElementById('caseDetailsContent');
                
                content.innerHTML = `
                    <h2>Деталі справи #${caseItem.id}</h2>
                    <div style="margin: 20px 0;">
                        <div class="case-header">
                            <h3>${caseItem.title}</h3>
                            <div class="case-priority priority-${caseItem.priority}">${this.getPriorityText(caseItem.priority)}</div>
                        </div>
                        <p style="margin: 15px 0;">${caseItem.description}</p>
                        <div class="case-details">
                            <div><strong>Тип:</strong> ${this.getTypeText(caseItem.type)}</div>
                            <div><strong>Статус:</strong> ${this.getStatusText(caseItem.status)}</div>
                            <div><strong>Слідчий:</strong> ${caseItem.investigator}</div>
                            <div><strong>Створено:</strong> ${caseItem.createdDate}</div>
                            <div><strong>Останнє оновлення:</strong> ${caseItem.updatedAt ? new Date(caseItem.updatedAt).toLocaleDateString('uk-UA') : 'Н/Д'}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button class="btn" onclick="closeCaseDetails()">Закрити</button>
                        <button class="btn btn-primary" onclick="editCase(${caseItem.id})">Редагувати</button>
                    </div>
                `;
                
                modal.style.display = 'flex';
                
                // Log view action
                await this.db.logAudit('case_view', `Viewed case #${caseItem.id}`);
            }

            setupEventListeners() {
                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.handleSearch();
                });
                
                // Filter functionality
                document.getElementById('statusFilter').addEventListener('change', () => {
                    this.handleSearch();
                });
                
                document.getElementById('priorityFilter').addEventListener('change', () => {
                    this.handleSearch();
                });
                
                document.getElementById('typeFilter').addEventListener('change', () => {
                    this.handleSearch();
                });
            }

            async handleSearch() {
                const query = document.getElementById('searchInput').value;
                const status = document.getElementById('statusFilter').value;
                const priority = document.getElementById('priorityFilter').value;
                const type = document.getElementById('typeFilter').value;
                
                const filters = { status, priority, type };
                const results = await this.db.searchCases(query, filters);
                
                this.renderCases(results);
                this.updateStatistics(results);
            }

            updateStatistics(cases = null) {
                const casesToCount = cases || this.cases;
                
                document.getElementById('totalCases').textContent = casesToCount.length;
                document.getElementById('activeCases').textContent = casesToCount.filter(c => c.status === 'active').length;
                document.getElementById('criticalCases').textContent = casesToCount.filter(c => c.priority === 'critical').length;
                document.getElementById('resolvedCases').textContent = casesToCount.filter(c => c.status === 'closed').length;
            }

            async createNewCase() {
                const title = document.getElementById('caseTitle').value;
                const description = document.getElementById('caseDescription').value;
                const type = document.getElementById('caseType').value;
                const priority = document.getElementById('casePriority').value;
                const investigator = document.getElementById('caseInvestigator').value;
                
                if (!title || !description) {
                    alert('Будь ласка, заповніть обов\'язкові поля');
                    return;
                }
                
                const newCase = {
                    title,
                    description,
                    type,
                    priority,
                    investigator,
                    status: 'active',
                    createdDate: new Date().toISOString().split('T')[0]
                };
                
                await this.db.addCase(newCase);
                await this.db.logAudit('case_created', `Created new case: ${title}`);
                
                this.closeNewCaseModal();
                await this.loadCases();
                
                alert('Справа успішно створена!');
            }
        }

        // 🚀 INITIALIZE EVERYTHING
        let app;
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize PWA
            const pwa = new PWAInstaller();
            
            // Initialize Mobile UI
            const mobileUI = new MobileUI();
            
            // Initialize Offline Manager
            const offlineManager = new OfflineManager();
            
            // Initialize Main App
            app = new ERDRApp();
            
            // Make functions global
            window.installPWA = () => pwa.installPWA();
            window.dismissInstall = () => pwa.hideInstallPrompt();
            window.openNewCaseModal = () => document.getElementById('newCaseModal').style.display = 'flex';
            window.closeNewCaseModal = () => document.getElementById('newCaseModal').style.display = 'none';
            window.closeCaseDetails = () => document.getElementById('caseDetailsModal').style.display = 'none';
            window.createNewCase = () => app.createNewCase();
            window.exportData = () => alert('Експорт даних у розробці...');
            window.showAuditLog = () => alert('Журнал аудиту у розробці...');
            window.logout = () => {
                if (confirm('Ви впевнені, що хочете вийти з системи?')) {
                    alert('Вихід з системи...');
                    // Redirect to login page
                }
            };
            
            console.log('🚀 ЄРДР PRO PWA initialized!');
        });
    </script>
</body>
