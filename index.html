<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЄРДР PRO - Розширена система</title>
    
    <!-- PWA METADATA -->
    <meta name="theme-color" content="#1e40af">
    <meta name="description" content="Професійна система управління розслідуваннями">
    <link rel="manifest" href="app.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3730a3;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --dark: #1f2937;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* MOBILE FIRST DESIGN */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }
            
            .header h1 {
                font-size: 1.8em !important;
            }
            
            .modal-content {
                width: 95% !important;
                margin: 10px !important;
                padding: 20px !important;
            }
            
            /* Mobile navigation */
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(30, 41, 59, 0.95);
                backdrop-filter: blur(20px);
                display: flex;
                justify-content: space-around;
                padding: 10px;
                border-top: 1px solid rgba(255,255,255,0.1);
                z-index: 1000;
            }
            
            .nav-btn {
                background: none;
                border: none;
                color: #94a3b8;
                padding: 10px;
                border-radius: 10px;
                transition: all 0.3s ease;
            }
            
            .nav-btn.active {
                background: var(--primary);
                color: white;
            }
        }

        /* PWA INSTALL PROMPT */
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1001;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* REST OF YOUR EXISTING STYLES... */
        .header {
            background: rgba(30, 64, 175, 0.9);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 25px;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .cases-container {
            display: grid;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .case-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .case-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div style="display: flex; justify-content: between; align-items: center;">
                <div>
                    <h1 style="font-size: 2.5em; margin-bottom: 10px;">🛡️ ЄРДР PRO</h1>
                    <p style="color: #cbd5e1; font-size: 1.1em;">Розширена система управління розслідуваннями</p>
                </div>
                <div class="security-badge">
                    🔒 ЗАСЕКРЕЧЕНО
                </div>
            </div>
        </header>

        <!-- PWA Install Prompt -->
        <div class="install-prompt" id="installPrompt" style="display: none;">
            <span>📱 Встановити додаток на пристрій</span>
            <button class="btn btn-success" onclick="installPWA()">Встановити</button>
            <button class="btn" onclick="dismissInstall()">Пізніше</button>
        </div>

        <!-- Main Content -->
        <div class="dashboard-grid">
            <!-- Cases Section -->
            <div class="card">
                <h2>📋 Справи та розслідування</h2>
                <div class="cases-container" id="casesList">
                    <!-- Cases will be loaded here -->
                </div>
            </div>

            <!-- User Panel -->
            <div class="card">
                <h2>👤 Панель управління</h2>
                <!-- Login form -->
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="mobile-nav">
            <button class="nav-btn active">📋</button>
            <button class="nav-btn">🔍</button>
            <button class="nav-btn">📊</button>
            <button class="nav-btn">⚙️</button>
        </div>
    </div>

    <script>
        // 🚀 PWA FUNCTIONALITY
        class PWAInstaller {
            constructor() {
                this.deferredPrompt = null;
                this.init();
            }

            init() {
                // Register Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js')
                        .then(registration => console.log('SW registered'))
                        .catch(error => console.log('SW registration failed'));
                }

                // Listen for install prompt
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                    this.showInstallPrompt();
                });

                // Track app installed
                window.addEventListener('appinstalled', () => {
                    this.hideInstallPrompt();
                    console.log('PWA installed');
                });
            }

            showInstallPrompt() {
                const prompt = document.getElementById('installPrompt');
                prompt.style.display = 'flex';
            }

            hideInstallPrompt() {
                const prompt = document.getElementById('installPrompt');
                prompt.style.display = 'none';
            }

            async installPWA() {
                if (this.deferredPrompt) {
                    this.deferredPrompt.prompt();
                    const { outcome } = await this.deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        this.hideInstallPrompt();
                    }
                    this.deferredPrompt = null;
                }
            }
        }

        // 📱 MOBILE FUNCTIONALITY
        class MobileUI {
            constructor() {
                this.currentView = 'cases';
                this.init();
            }

            init() {
                this.setupMobileNav();
                this.detectMobile();
                this.setupTouchGestures();
            }

            setupMobileNav() {
                const navBtns = document.querySelectorAll('.nav-btn');
                navBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        navBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.switchView(e.target.textContent);
                    });
                });
            }

            switchView(view) {
                // Handle mobile view switching
                console.log('Switching to view:', view);
                // Implementation for mobile views
            }

            detectMobile() {
                if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                    document.body.classList.add('mobile-device');
                }
            }

            setupTouchGestures() {
                let startX, startY;
                
                document.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });

                document.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;

                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;
                    
                    const diffX = startX - endX;
                    const diffY = startY - endY;

                    // Swipe left/right detection
                    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                        if (diffX > 0) {
                            this.handleSwipe('left');
                        } else {
                            this.handleSwipe('right');
                        }
                    }
                });
            }

            handleSwipe(direction) {
                console.log('Swipe detected:', direction);
                // Implement swipe navigation
            }
        }

        // 💾 OFFLINE FUNCTIONALITY
        class OfflineManager {
            constructor() {
                this.isOnline = navigator.onLine;
                this.init();
            }

            init() {
                window.addEventListener('online', () => this.handleOnline());
                window.addEventListener('offline', () => this.handleOffline());
                
                // Check initial status
                if (!this.isOnline) {
                    this.handleOffline();
                }
            }

            handleOnline() {
                this.isOnline = true;
                document.body.classList.remove('offline');
                console.log('App is online');
                // Sync pending changes
                this.syncPendingChanges();
            }

            handleOffline() {
                this.isOnline = false;
                document.body.classList.add('offline');
                console.log('App is offline');
                this.showOfflineNotification();
            }

            showOfflineNotification() {
                // Show offline indicator
                const indicator = document.createElement('div');
                indicator.style.cssText = `
                    position: fixed;
                    top: 10px;
                    right: 10px;
                    background: var(--warning);
                    color: white;
                    padding: 10px 15px;
                    border-radius: 10px;
                    z-index: 1002;
                `;
                indicator.textContent = '🔴 Офлайн режим';
                indicator.id = 'offlineIndicator';
                document.body.appendChild(indicator);
            }

            async syncPendingChanges() {
                // Sync any pending changes when coming online
                console.log('Syncing pending changes...');
            }
        }

        // 🚀 INITIALIZE EVERYTHING
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize PWA
            const pwa = new PWAInstaller();
            
            // Initialize Mobile UI
            const mobileUI = new MobileUI();
            
            // Initialize Offline Manager
            const offlineManager = new OfflineManager();
            
            // Make install function global
            window.installPWA = () => pwa.installPWA();
            window.dismissInstall = () => pwa.hideInstallPrompt();
            
            console.log('🚀 ЄРДР PRO PWA initialized!');
        });

        // Your existing system code continues here...
        // [YOUR EXISTING SECURITY SYSTEM, DATABASE, ETC.]
    </script>
</body>
</html>
