<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЄРДР - Розширена система</title>
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3730a3;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --dark: #1f2937;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(30, 64, 175, 0.9);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .security-badge {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 15px;
        }

        /* Cards */
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        /* Grid System */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 25px;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Stats Cards */
        .stat-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 5px;
        }

        /* Cases List */
        .cases-container {
            display: grid;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .case-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .case-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.3);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        /* Security Features */
        .security-panel {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .activity-log {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px 12px;
            border-left: 3px solid var(--primary);
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div style="display: flex; justify-content: between; align-items: center;">
                <div>
                    <h1 style="font-size: 2.5em; margin-bottom: 10px;">🛡️ ЄРДР PRO</h1>
                    <p style="color: #cbd5e1; font-size: 1.1em;">Розширена система управління розслідуваннями</p>
                </div>
                <div class="security-badge">
                    🔒 ЗАСЕКРЕЧЕНО
                </div>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCases">0</div>
                <div>Всього справ</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeCases">0</div>
                <div>Активних розслідувань</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayActivity">0</div>
                <div>Сьогодні дій</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="securityLevel">100%</div>
                <div>Рівень безпеки</div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-grid">
            <!-- Left Column -->
            <div>
                <!-- Cases Section -->
                <div class="card">
                    <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 20px;">
                        <h2>📋 Справи та розслідування</h2>
                        <button class="btn btn-success" onclick="openCaseModal()">
                            ➕ Нова справа
                        </button>
                    </div>
                    
                    <div class="search-box" style="margin-bottom: 20px;">
                        <input type="text" class="form-control" id="searchInput" placeholder="🔍 Пошук по всіх полях...">
                    </div>

                    <div class="cases-container" id="casesList">
                        <!-- Cases will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- User Panel -->
                <div class="card">
                    <h2 style="margin-bottom: 20px;">👤 Панель управління</h2>
                    
                    <div id="loginSection">
                        <div class="security-panel">
                            <h4>🛡️ Авторизація</h4>
                            <div class="form-group">
                                <label>Орган:</label>
                                <select class="form-control" id="agencySelect">
                                    <option value="sbu">Служба безпеки України (СБУ)</option>
                                    <option value="npu">Національна поліція України (НПУ)</option>
                                    <option value="prosecutor">Офіс Генерального прокурора</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>ПІБ співробітника:</label>
                                <input type="text" class="form-control" id="userName" placeholder="Повне ПІБ">
                            </div>
                            <div class="form-group">
                                <label>Службовий пароль:</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••">
                            </div>
                            <div id="securityWarning" style="color: #fca5a5; font-size: 12px; margin-bottom: 15px; display: none;">
                                ⚠️ Залишилось спроб: <span id="attemptsCount">3</span>
                            </div>
                            <button class="btn btn-primary" onclick="advancedLogin()" style="width: 100%;">
                                🔐 Увійти в систему
                            </button>
                        </div>
                    </div>

                    <div id="userSection" style="display: none;">
                        <div style="background: rgba(5, 150, 105, 0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                            <div id="userDetails"></div>
                        </div>

                        <div style="display: grid; gap: 10px;">
                            <button class="btn btn-success" onclick="openCaseModal()">
                                ➕ Нова справа
                            </button>
                            <button class="btn btn-warning" onclick="generateAdvancedReport()">
                                📊 Розширений звіт
                            </button>
                            <button class="btn" onclick="showActivityLog()">
                                📋 Журнал активності
                            </button>
                            <button class="btn btn-danger" onclick="secureLogout()">
                                🚪 Безпечний вихід
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Security Monitor -->
                <div class="card">
                    <h3 style="margin-bottom: 15px;">🔐 Монітор безпеки</h3>
                    <div class="activity-log" id="securityLog">
                        <!-- Security logs will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Case Modal -->
    <div class="modal" id="caseModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;" id="modalTitle">📁 Нова справа</h2>
            
            <form onsubmit="saveAdvancedCase(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label>Номер справи:</label>
                        <input type="text" class="form-control" id="caseNumber" required>
                    </div>
                    <div class="form-group">
                        <label>Дата реєстрації:</label>
                        <input type="date" class="form-control" id="caseDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Тип злочину:</label>
                    <select class="form-control" id="crimeType" required>
                        <option value="Кримінальне">Кримінальне правопорушення</option>
                        <option value="Кіберзлочин">Кіберзлочинність</option>
                        <option value="Корупція">Корупційний злочин</option>
                        <option value="Економічний">Економічний злочин</option>
                        <option value="Тероризм">Тероризм</option>
                        <option value="Наркотики">Наркоторгівля</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Статус справи:</label>
                    <select class="form-control" id="caseStatus" required>
                        <option value="Нова">Нова</option>
                        <option value="В розслідуванні">В розслідуванні</option>
                        <option value="Призупинена">Призупинена</option>
                        <option value="Завершена">Завершена</option>
                        <option value="Архів">В архіві</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Опис справи:</label>
                    <textarea class="form-control" id="caseDescription" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label>Пріоритет:</label>
                    <select class="form-control" id="casePriority" required>
                        <option value="Низький">Низький</option>
                        <option value="Середній">Середній</option>
                        <option value="Високий">Високий</option>
                        <option value="Критичний">Критичний</option>
                    </select>
                </div>

                <!-- Advanced Personnel Section -->
                <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin: 20px 0;">
                    <h4 style="margin-bottom: 15px;">👥 Прикріплений персонал</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>⚖️ Суддя:</label>
                            <input type="text" class="form-control" id="assignedJudge" placeholder="ПІБ судді">
                        </div>
                        <div class="form-group">
                            <label>👨‍⚖️ Прокурор:</label>
                            <input type="text" class="form-control" id="assignedProsecutor" placeholder="ПІБ прокурора">
                        </div>
                        <div class="form-group">
                            <label>🛡️ Керівник слідства:</label>
                            <input type="text" class="form-control" id="investigationHead" placeholder="ПІБ керівника">
                        </div>
                        <div class="form-group">
                            <label>🔍 Додатковий слідчий:</label>
                            <input type="text" class="form-control" id="additionalInvestigator" placeholder="ПІБ слідчого">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;">
                    <button type="button" class="btn" onclick="closeModal()">Скасувати</button>
                    <button type="submit" class="btn btn-success">💾 Зберегти справу</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🚀 РОЗШИРЕНА СИСТЕМА З ІНДЕКСОВАНОЮ БАЗОЮ ДАНИХ

        // Конфігурація безпеки
        const SECURITY_CONFIG = {
            maxAttempts: 3,
            blockDuration: 30 * 60 * 1000, // 30 хвилин
            sessionDuration: 8 * 60 * 60 * 1000, // 8 годин
            encryptionKey: 'ERDR_PRO_SECURE_2024'
        };

        // Розширена база паролів з рівнями доступу
        const ADVANCED_PASSWORDS = {
            sbu: {
                passwords: ['SBU001', 'SBU002', 'SBU003', 'SBU004', 'SBU005', 'SBU006', 'SBU007', 'SBU008', 'SBU009', 'SBU010'],
                accessLevel: 'top_secret'
            },
            npu: {
                passwords: ['NPU101', 'NPU102', 'NPU103', 'NPU104', 'NPU105', 'NPU106', 'NPU107', 'NPU108', 'NPU109'],
                accessLevel: 'secret'
            },
            prosecutor: {
                passwords: ['PROC1', 'PROC2', 'PROC3', 'PROC4', 'PROC5'],
                accessLevel: 'top_secret'
            }
        };

        // Глобальний стан безпеки
        let securityState = {
            loginAttempts: 0,
            blockedUntil: 0,
            currentSession: null,
            activityLog: [],
            lastBackup: null
        };

        // 🗄️ РОЗШИРЕНА INDEXEDDB БАЗА ДАНИХ
        class ERDRDatabase {
            constructor() {
                this.dbName = 'ERDR_Advanced_DB';
                this.version = 2;
                this.db = null;
            }

            // Ініціалізація бази даних
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;

                        // Сховище для справ
                        if (!db.objectStoreNames.contains('cases')) {
                            const casesStore = db.createObjectStore('cases', { keyPath: 'id' });
                            casesStore.createIndex('agency', 'agency', { unique: false });
                            casesStore.createIndex('status', 'status', { unique: false });
                            casesStore.createIndex('priority', 'priority', { unique: false });
                            casesStore.createIndex('created', 'created', { unique: false });
                        }

                        // Сховище для логів безпеки
                        if (!db.objectStoreNames.contains('security_logs')) {
                            const logsStore = db.createObjectStore('security_logs', { keyPath: 'id', autoIncrement: true });
                            logsStore.createIndex('timestamp', 'timestamp', { unique: false });
                        }

                        // Сховище для користувачів та сесій
                        if (!db.objectStoreNames.contains('sessions')) {
                            db.createObjectStore('sessions', { keyPath: 'sessionId' });
                        }
                    };
                });
            }

            // Зберегти справу
            async saveCase(caseData) {
                const transaction = this.db.transaction(['cases'], 'readwrite');
                const store = transaction.objectStore('cases');
                return store.put(caseData);
            }

            // Отримати всі справи для органу
            async getCases(agency) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['cases'], 'readonly');
                    const store = transaction.objectStore('cases');
                    const index = store.index('agency');
                    const request = index.getAll(agency);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            // Видалити справу
            async deleteCase(caseId) {
                const transaction = this.db.transaction(['cases'], 'readwrite');
                const store = transaction.objectStore('cases');
                return store.delete(caseId);
            }

            // Додати запис в лог безпеки
            async logSecurityEvent(event) {
                const transaction = this.db.transaction(['security_logs'], 'readwrite');
                const store = transaction.objectStore('security_logs');
                const logEntry = {
                    ...event,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };
                return store.add(logEntry);
            }

            // Отримати останні логи
            async getRecentLogs(limit = 10) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['security_logs'], 'readonly');
                    const store = transaction.objectStore('security_logs');
                    const index = store.index('timestamp');
                    const request = index.openCursor(null, 'prev');

                    const logs = [];
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor && logs.length < limit) {
                            logs.push(cursor.value);
                            cursor.continue();
                        } else {
                            resolve(logs);
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            }
        }

        // Ініціалізація глобальних змінних
        const advancedDB = new ERDRDatabase();
        let currentUser = null;

        // 🚀 ІНІЦІАЛІЗАЦІЯ СИСТЕМИ
        async function initSystem() {
            try {
                await advancedDB.init();
                await loadSecurityState();
                await updateSecurityLog();
                updateDashboardStats();
                
                // Перевірка активної сесії
                const savedSession = localStorage.getItem('erdr_pro_session');
                if (savedSession) {
                    const session = JSON.parse(savedSession);
                    if (new Date(session.expires) > new Date()) {
                        currentUser = session;
                        updateUI();
                        loadCases();
                    } else {
                        localStorage.removeItem('erdr_pro_session');
                    }
                }

                // Автоматичне оновлення статистики
                setInterval(updateDashboardStats, 30000);
                
            } catch (error) {
                console.error('Помилка ініціалізації:', error);
                alert('❌ Помилка завантаження системи');
            }
        }

        // 🛡️ РОЗШИРЕНА СИСТЕМА АВТОРИЗАЦІЇ
        async function advancedLogin() {
            if (securityState.blockedUntil > Date.now()) {
                alert('🚫 Система заблокована! Спробуйте пізніше.');
                return;
            }

            const agency = document.getElementById('agencySelect').value;
            const userName = document.getElementById('userName').value.trim();
            const password = document.getElementById('password').value;

            if (!userName || !password) {
                alert('❌ Заповніть всі поля');
                return;
            }

            const agencyConfig = ADVANCED_PASSWORDS[agency];
            if (agencyConfig && agencyConfig.passwords.includes(password)) {
                // Успішна авторизація
                await handleSuccessfulLogin(agency, userName, password, agencyConfig.accessLevel);
            } else {
                // Невдала спроба
                await handleFailedLogin(agency, userName);
            }
        }

        async function handleSuccessfulLogin(agency, userName, password, accessLevel) {
            securityState.loginAttempts = 0;
            await saveSecurityState();

            const sessionId = generateSessionId();
            const session = {
                sessionId,
                agency,
                user: userName,
                userId: generateUserId(agency, password),
                accessLevel,
                loginTime: new Date().toISOString(),
                expires: new Date(Date.now() + SECURITY_CONFIG.sessionDuration).toISOString()
            };

            currentUser = session;
            localStorage.setItem('erdr_pro_session', JSON.stringify(session));

            await advancedDB.logSecurityEvent({
                type: 'LOGIN_SUCCESS',
                user: userName,
                agency,
                accessLevel,
                sessionId
            });

            updateUI();
            await loadCases();
            await updateSecurityLog();
            updateDashboardStats();

            document.getElementById('securityWarning').style.display = 'none';
        }

        async function handleFailedLogin(agency, userName) {
            securityState.loginAttempts++;
            
            if (securityState.loginAttempts >= SECURITY_CONFIG.maxAttempts) {
                securityState.blockedUntil = Date.now() + SECURITY_CONFIG.blockDuration;
                await advancedDB.logSecurityEvent({
                    type: 'SYSTEM_BLOCKED',
                    reason: 'MAX_ATTEMPTS_EXCEEDED',
                    user: userName,
                    agency
                });
                alert('🚫 Система заблокована на 30 хвилин!');
            } else {
                await advancedDB.logSecurityEvent({
                    type: 'LOGIN_FAILED',
                    user: userName,
                    agency,
                    attempts: securityState.loginAttempts
                });
                alert(`❌ Невірний пароль! Залишилось спроб: ${SECURITY_CONFIG.maxAttempts - securityState.loginAttempts}`);
            }

            await saveSecurityState();
            updateSecurityWarning();
        }

        // 📊 ОНОВЛЕННЯ ІНТЕРФЕЙСУ
        function updateUI() {
            if (currentUser) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                
                document.getElementById('userDetails').innerHTML = `
                    <strong>Орган:</strong> ${getAgencyName(currentUser.agency)}<br>
                    <strong>Користувач:</strong> ${currentUser.user}<br>
                    <strong>ID:</strong> ${currentUser.userId}<br>
                    <strong>Рівень доступу:</strong> ${currentUser.accessLevel}<br>
                    <strong>Сесія:</strong> ${new Date(currentUser.loginTime).toLocaleString()}
                `;
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
            }
        }

        async function updateSecurityLog() {
            const logs = await advancedDB.getRecentLogs(5);
            const logContainer = document.getElementById('securityLog');
            logContainer.innerHTML = logs.map(log => `
                <div class="log-entry">
                    <div style="font-size: 11px; color: #94a3b8;">${new Date(log.timestamp).toLocaleTimeString()}</div>
                    <div style="font-size: 12px;">${log.type} - ${log.user || 'Система'}</div>
                </div>
            `).join('');
        }

        // 🗂️ РОБОТА ЗІ СПРАВАМИ
        async function loadCases() {
            if (!currentUser) return;
            
            const cases = await advancedDB.getCases(currentUser.agency);
            renderCases(cases);
            updateDashboardStats();
        }

        function renderCases(cases) {
            const container = document.getElementById('casesList');
            
            if (cases.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #94a3b8;">Немає справ для відображення</div>';
                return;
            }

            container.innerHTML = cases.map(caseItem => `
                <div class="case-item">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
                        <div style="font-weight: bold; font-size: 18px;">📁 Справа №${caseItem.number}</div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span style="background: ${getPriorityColor(caseItem.priority)}; padding: 4px 8px; border-radius: 12px; font-size: 11px;">
                                ${caseItem.priority}
                            </span>
                            <span style="background: #374151; padding: 4px 8px; border-radius: 12px; font-size: 11px;">
                                ${caseItem.status}
                            </span>
                        </div>
                    </div>
                    
                    <div style="color: #94a3b8; margin-bottom: 10px;">
                        📅 ${caseItem.date} • 🎯 ${caseItem.type}
                    </div>
                    
                    <div style="margin-bottom: 15px; line-height: 1.5;">${caseItem.description}</div>
                    
                    <div style="color: #cbd5e1; font-size: 14px; margin-bottom: 10px;">
                        👤 Відповідальний: ${caseItem.investigator}
                    </div>
                    
                    ${renderPersonnelSection(caseItem)}
                    
                    <div style="display: flex; gap: 8px; margin-top: 15px;">
                        <button class="btn btn-danger" onclick="deleteAdvancedCase('${caseItem.id}')" style="padding: 8px 16px; font-size: 12px;">
                            🗑️ Видалити
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPersonnelSection(caseItem) {
            const personnel = [];
            if (caseItem.assignedJudge) personnel.push(`<div><strong>⚖️ Суддя:</strong> ${caseItem.assignedJudge}</div>`);
            if (caseItem.assignedProsecutor) personnel.push(`<div><strong>👨‍⚖️ Прокурор:</strong> ${caseItem.assignedProsecutor}</div>`);
            if (caseItem.investigationHead) personnel.push(`<div><strong>🛡️ Керівник:</strong> ${caseItem.investigationHead}</div>`);
            if (caseItem.additionalInvestigator) personnel.push(`<div><strong>🔍 Слідчий:</strong> ${caseItem.additionalInvestigator}</div>`);

            if (personnel.length === 0) return '';
            
            return `
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-top: 10px;">
                    <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">👥 Прикріплений персонал:</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px;">
                        ${personnel.join('')}
                    </div>
                </div>
            `;
        }

        // 🎯 ДОДАТКОВІ ФУНКЦІЇ
        async function updateDashboardStats() {
            if (!currentUser) return;

            const cases = await advancedDB.getCases(currentUser.agency);
            const activeCases = cases.filter(c => c.status === 'В розслідуванні').length;
            
            document.getElementById('totalCases').textContent = cases.length;
            document.getElementById('activeCases').textContent = activeCases;
            document.getElementById('todayActivity').textContent = securityState.activityLog.length;
        }

        function generateSessionId() {
            return 'SESS_' + Date.now() + '_' + Math.random().toString(36).substr(2, 16);
        }

        function generateUserId(agency, password) {
            const index = ADVANCED_PASSWORDS[agency].passwords.indexOf(password) + 1;
            const prefixes = { sbu: 'SBU', npu: 'NPU', prosecutor: 'PROC' };
            return `${prefixes[agency]}${index.toString().padStart(3, '0')}`;
        }

        function getAgencyName(agency) {
            const names = {
                sbu: 'Служба безпеки України',
                npu: 'Національна поліція України',
                prosecutor: 'Офіс Генерального прокурора'
            };
            return names[agency] || agency;
        }

        function getPriorityColor(priority) {
            const colors = {
                'Низький': '#059669',
                'Середній': '#d97706',
                'Високий': '#dc2626',
                'Критичний': '#7c2d12'
            };
            return colors[priority] || '#374151';
        }

        // 🚪 ВИХІД ТА БЕЗПЕКА
        async function secureLogout() {
            if (currentUser) {
                await advancedDB.logSecurityEvent({
                    type: 'LOGOUT',
                    user: currentUser.user,
                    agency: currentUser.agency
                });
            }

            currentUser = null;
            localStorage.removeItem('erdr_pro_session');
            updateUI();
            document.getElementById('casesList').innerHTML = '';
            
            await updateSecurityLog();
        }

        // 💾 ДОДАТКОВІ ФУНКЦІЇ
        async function loadSecurityState() {
            const saved = localStorage.getItem('erdr_security_state');
            if (saved) {
                securityState = { ...securityState, ...JSON.parse(saved) };
            }
        }

        async function saveSecurityState() {
            localStorage.setItem('erdr_security_state', JSON.stringify(securityState));
        }

        function updateSecurityWarning() {
            if (securityState.loginAttempts > 0) {
                document.getElementById('securityWarning').style.display = 'block';
                document.getElementById('attemptsCount').textContent = SECURITY_CONFIG.maxAttempts - securityState.loginAttempts;
            } else {
                document.getElementById('securityWarning').style.display = 'none';
            }
        }

        // 🎛️ МОДАЛЬНІ ВІКНА ТА ФОРМИ
        function openCaseModal() {
            if (!currentUser) {
                alert('❌ Спочатку увійдіть в систему');
                return;
            }

            document.getElementById('modalTitle').textContent = '📁 Нова справа';
            document.getElementById('caseModal').style.display = 'flex';
            
            // Очистити форму
            ['caseNumber', 'caseDate', 'caseDescription', 'assignedJudge', 'assignedProsecutor', 'investigationHead', 'additionalInvestigator']
                .forEach(id => document.getElementById(id).value = '');
            
            document.getElementById('caseDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('caseStatus').value = 'Нова';
            document.getElementById('casePriority').value = 'Середній';
        }

        function closeModal() {
            document.getElementById('caseModal').style.display = 'none';
        }

        async function saveAdvancedCase(event) {
            event.preventDefault();
            
            const caseData = {
                id: 'case_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                number: document.getElementById('caseNumber').value,
                date: document.getElementById('caseDate').value,
                type: document.getElementById('crimeType').value,
                status: document.getElementById('caseStatus').value,
                priority: document.getElementById('casePriority').value,
                description: document.getElementById('caseDescription').value,
                investigator: currentUser.user,
                agency: currentUser.agency,
                assignedJudge: document.getElementById('assignedJudge').value.trim(),
                assignedProsecutor: document.getElementById('assignedProsecutor').value.trim(),
                investigationHead: document.getElementById('investigationHead').value.trim(),
                additionalInvestigator: document.getElementById('additionalInvestigator').value.trim(),
                created: new Date().toISOString(),
                lastModified: new Date().toISOString()
            };

            try {
                await advancedDB.saveCase(caseData);
                await advancedDB.logSecurityEvent({
                    type: 'CASE_CREATED',
                    user: currentUser.user,
                    caseId: caseData.id,
                    caseNumber: caseData.number
                });

                closeModal();
                await loadCases();
                alert('✅ Справу успішно збережено!');
            } catch (error) {
                console.error('Помилка збереження:', error);
                alert('❌ Помилка збереження справи');
            }
        }

        async function deleteAdvancedCase(caseId) {
            if (!confirm('🗑️ Ви впевнені, що хочете видалити цю справу?')) return;

            try {
                await advancedDB.deleteCase(caseId);
                await advancedDB.logSecurityEvent({
                    type: 'CASE_DELETED',
                    user: currentUser.user,
                    caseId: caseId
                });

                await loadCases();
                alert('✅ Справу успішно видалено!');
            } catch (error) {
                console.error('Помилка видалення:', error);
                alert('❌ Помилка видалення справи');
            }
        }

        function generateAdvancedReport() {
            alert('📊 Функція розширеного звіту в розробці...');
        }

        function showActivityLog() {
            alert('📋 Повний журнал активності в розробці...');
        }

        // 🚀 ЗАПУСК СИСТЕМИ
        document.addEventListener('DOMContentLoaded', function() {
            initSystem();
        });
    </script>
</body>
</html>
